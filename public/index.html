<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health System - Portal</title>
    <style>
        body { font-family: sans-serif; background: #e8f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tabs { display: flex; margin-bottom: 20px; cursor: pointer; }
        .tab { flex: 1; text-align: center; padding: 10px; background: #eee; font-weight: bold; }
        .tab.active { background: #3498db; color: white; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="box">
    <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="switchTab('login')">Login</div>
        <div class="tab" id="tabRegister" onclick="switchTab('register')">Register</div>
    </div>
    <div id="loginForm">
        <h2>Login</h2>
        <select id="loginRole"><option value="patient">Patient</option><option value="doctor">Doctor</option></select>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="loginUser()">Login</button>
    </div>
    <div id="registerForm" class="hidden">
        <h2>Register</h2>
        <select id="regRole" onchange="toggleRegFields()"><option value="patient">Patient</option><option value="doctor">Doctor</option></select>
        <input type="text" id="regUsername" placeholder="Create Username">
        <input type="password" id="regPassword" placeholder="Create Password">
        <input type="text" id="regName" placeholder="Full Name">
        <div id="patientFields">
            <input type="number" id="regAge" placeholder="Age">
            <input type="text" id="regBlood" placeholder="Blood Group (e.g., O+)">
            <input type="number" id="regWeight" placeholder="Weight (kg)">
            <input type="text" id="regContact" placeholder="Contact Number">
        </div>
        <div id="doctorFields" class="hidden">
            <input type="text" id="regSpecialty" placeholder="Specialty">
            <input type="text" id="regExperience" placeholder="Experience">
            <input type="email" id="regDocEmail" placeholder="Email Address">
            <input type="text" id="regDocPhone" placeholder="Phone Number">
        </div>
        <button onclick="registerUser()">Register</button>
    </div>
</div>
<script>
    const API_URL = 'http://localhost:3000/api';
    function switchTab(tab) {
        document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    }
    function toggleRegFields() {
        const role = document.getElementById('regRole').value;
        document.getElementById('patientFields').classList.toggle('hidden', role !== 'patient');
        document.getElementById('doctorFields').classList.toggle('hidden', role !== 'doctor');
    }
    async function registerUser() {
        const role = document.getElementById('regRole').value;
        const data = { role, username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value, name: document.getElementById('regName').value };
        if (role === 'patient') {
            Object.assign(data, { age: document.getElementById('regAge').value, blood_group: document.getElementById('regBlood').value, weight: document.getElementById('regWeight').value, contact: document.getElementById('regContact').value });
        } else {
            Object.assign(data, { specialty: document.getElementById('regSpecialty').value, experience: document.getElementById('regExperience').value, email: document.getElementById('regDocEmail').value, phone: document.getElementById('regDocPhone').value });
        }
        const res = await fetch(`${API_URL}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        alert(result.message);
        if (result.success) switchTab('login');
    }
    async function loginUser() {
        const data = { role: document.getElementById('loginRole').value, username: document.getElementById('loginUsername').value, password: document.getElementById('loginPassword').value };
        const res = await fetch(`${API_URL}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
            localStorage.setItem('loggedInUser', JSON.stringify(result.user));
            window.location.href = data.role === 'patient' ? 'patient.html' : 'doctor.html';
        } else alert(result.message);
    }
</script>
</body>
</html>
